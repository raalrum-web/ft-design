<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forest greens</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="swatch">
      <div class="swatch-chip" style="background:#3D5530"></div>
      <div class="swatch-name">Forest Deep</div><div class="swatch-hex">#3D5530</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#4F6B3F"></div>
      <div class="swatch-name">Forest</div><div class="swatch-hex">#4F6B3F</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#6B8156"></div>
      <div class="swatch-name">Forest Muted</div><div class="swatch-hex">#6B8156</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#B8C2A8"></div>
      <div class="swatch-name">Sage</div><div class="swatch-hex">#B8C2A8</div>
    </div>
  </div>
</div>
</body>
</html>
