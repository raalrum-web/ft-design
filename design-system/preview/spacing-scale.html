<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spacing</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 8px; padding: 22px 28px; justify-content: center; }
  .row { display: flex; align-items: center; gap: 12px; }
  .label { width: 64px; font-family: var(--font-mono, monospace); font-size: 11px; color: var(--fg-3); }
  .bar { height: 14px; background: var(--ft-forest); border-radius: 2px; }
  .px { font-family: var(--font-mono, monospace); font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="row"><div class="label">--sp-1</div><div class="bar" style="width:4px"></div><div class="px">4</div></div>
  <div class="row"><div class="label">--sp-2</div><div class="bar" style="width:8px"></div><div class="px">8</div></div>
  <div class="row"><div class="label">--sp-3</div><div class="bar" style="width:12px"></div><div class="px">12</div></div>
  <div class="row"><div class="label">--sp-4</div><div class="bar" style="width:16px"></div><div class="px">16</div></div>
  <div class="row"><div class="label">--sp-5</div><div class="bar" style="width:24px"></div><div class="px">24</div></div>
  <div class="row"><div class="label">--sp-6</div><div class="bar" style="width:32px"></div><div class="px">32</div></div>
  <div class="row"><div class="label">--sp-7</div><div class="bar" style="width:48px"></div><div class="px">48</div></div>
  <div class="row"><div class="label">--sp-8</div><div class="bar" style="width:64px"></div><div class="px">64</div></div>
</div>
</body>
</html>
