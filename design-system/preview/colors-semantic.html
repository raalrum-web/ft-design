<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Semantic colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="swatch">
      <div class="swatch-chip" style="background:#4F6B3F"></div>
      <div class="swatch-name">Success</div><div class="swatch-hex">#4F6B3F · forest</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#B88B4A"></div>
      <div class="swatch-name">Warning</div><div class="swatch-hex">#B88B4A · brass</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#8C3A2E"></div>
      <div class="swatch-name">Error</div><div class="swatch-hex">#8C3A2E · brick</div>
    </div>
  </div>
</div>
</body>
</html>
