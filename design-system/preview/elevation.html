<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elevation</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 28px; justify-content: center; background: var(--ft-cream); }
  .row { display: flex; gap: 20px; align-items: center; justify-content: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box {
    width: 120px; height: 70px;
    background: var(--ft-paper);
    border-radius: 6px;
    border: 1px solid var(--line-soft);
  }
  .s1 { box-shadow: 0 1px 2px rgba(31,27,23,.06), 0 1px 1px rgba(31,27,23,.04); }
  .s2 { box-shadow: 0 4px 12px rgba(31,27,23,.08), 0 1px 2px rgba(31,27,23,.04); }
  .s3 { box-shadow: 0 12px 32px rgba(31,27,23,.10), 0 2px 6px rgba(31,27,23,.04); }
  .name { font-family: var(--font-mono, monospace); font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="item"><div class="box s1"></div><div class="name">--shadow-1</div></div>
    <div class="item"><div class="box s2"></div><div class="name">--shadow-2</div></div>
    <div class="item"><div class="box s3"></div><div class="name">--shadow-3</div></div>
  </div>
</div>
</body>
</html>
