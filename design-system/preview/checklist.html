<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checklist</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px 28px; justify-content: center; gap: 10px; }
  .item { display: flex; align-items: flex-start; gap: 12px; font-family: var(--font-body); font-size: 14px; line-height: 1.55; color: var(--fg-2); }
  .check {
    flex: 0 0 18px; width: 18px; height: 18px;
    color: var(--ft-walnut);
  }
  .item strong { color: var(--ft-ink); font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="item">
    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <div><strong>Architectural and interior advice</strong> across plan layout and spatial allocation.</div>
  </div>
  <div class="item">
    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <div><strong>Material, color, and lighting</strong> direction tailored to your home and lifestyle.</div>
  </div>
  <div class="item">
    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <div><strong>Furniture and accessory</strong> guidance, including in-store walkthroughs.</div>
  </div>
</div>
</body>
</html>
