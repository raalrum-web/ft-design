<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display type</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 4px; padding: 24px 28px; }
  .display { font-family: var(--font-display); color: var(--ft-ink); font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; }
  .l1 { font-size: 64px; }
  .l2 { font-size: 44px; }
  .l3 { font-size: 30px; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <div class="meta">Cormorant Garamond · 500</div>
  <div class="display l1">A studio for considered interiors.</div>
  <div class="display l2">Considered interiors.</div>
  <div class="display l3">Section heading</div>
</div>
</body>
</html>
