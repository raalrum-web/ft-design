<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Card</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 22px; justify-content: center; align-items: center; }
  .demo {
    background: var(--ft-paper);
    border-radius: 6px;
    padding: 22px 24px;
    box-shadow: 0 4px 12px rgba(31,27,23,.08), 0 1px 2px rgba(31,27,23,.04);
    width: 100%;
    max-width: 520px;
  }
  .eyebrow { font-family: var(--font-body); font-weight: 500; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ft-forest); margin-bottom: 10px; }
  .title { font-family: var(--font-display); font-weight: 500; font-size: 26px; line-height: 1.15; letter-spacing: -0.01em; color: var(--ft-ink); margin-bottom: 8px; }
  .body { font-family: var(--font-body); font-size: 14px; line-height: 1.6; color: var(--fg-2); margin-bottom: 14px; }
  .meta-row { display: flex; gap: 18px; align-items: center; font-family: var(--font-body); font-size: 13px; color: var(--fg-3); }
  .meta-row .price { color: var(--ft-ink); font-weight: 600; }
  .divider { border-top: 1px solid var(--line); margin: 14px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="demo">
    <div class="eyebrow">In-person consultation</div>
    <div class="title">Sit with us in your space.</div>
    <div class="body">Forty-five minutes on site, walking through the floor plan and material decisions together.</div>
    <div class="divider"></div>
    <div class="meta-row">
      <span>⏱ 45 min</span>
      <span class="price">QAR 5,000</span>
    </div>
  </div>
</div>
</body>
</html>
