<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arabic type</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 10px; padding: 22px 28px; align-items: stretch; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; }
  .ar { font-family: var(--font-arabic); direction: rtl; text-align: right; color: var(--ft-ink); }
  .ar-display { font-family: var(--font-arabic-display); direction: rtl; text-align: right; color: var(--ft-ink); }
  .h2 { font-weight: 700; font-size: 30px; line-height: 1.4; }
  .h3 { font-weight: 600; font-size: 22px; line-height: 1.6; }
  .body { font-weight: 400; font-size: 16px; line-height: 1.85; color: var(--fg-2); }
</style>
</head>
<body>
<div class="card">
  <div class="meta">Display: Tajawal · Body: IBM Plex Sans Arabic</div>
  <div class="ar-display h2">الاستشارة العامة للفلل السكنية</div>
  <div class="ar h3">على ماذا تشتمل الباقات</div>
  <div class="ar body">تتضمن تحديد وتوجيه العميل في كيفيه البدء وتحديد المتطلبات الاساسيه الخاصة به.</div>
</div>
</body>
</html>
