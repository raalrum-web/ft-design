<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Body type</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { gap: 10px; padding: 22px 28px; }
  .meta { font-family: var(--font-body); font-size: 11px; color: var(--fg-3); letter-spacing: 0.08em; text-transform: uppercase; }
  .eyebrow { font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2); }
  .body-lg { font-family: var(--font-body); font-size: 18px; line-height: 1.7; color: var(--fg-2); }
  .body { font-family: var(--font-body); font-size: 16px; line-height: 1.6; color: var(--fg-2); }
  .caption { font-family: var(--font-body); font-size: 14px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="meta">Inter · 400 / 500</div>
  <div class="eyebrow">Design Consultation Services</div>
  <div class="body-lg">Body Large — 18 / 30. Sub-headings and intro copy.</div>
  <div class="body">Body — 16 / 26. Default reading size; service descriptions, terms, and longer passages of marketing copy use this throughout.</div>
  <div class="caption">Caption — 14 / 21. Form helper text, footer copy, and metadata.</div>
</div>
</body>
</html>
