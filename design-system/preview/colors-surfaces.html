<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Surface colors</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="swatch">
      <div class="swatch-chip" style="background:#FBF8F0"></div>
      <div class="swatch-name">Paper</div><div class="swatch-hex">#FBF8F0</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#F4EEDF"></div>
      <div class="swatch-name">Cream Soft</div><div class="swatch-hex">#F4EEDF</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#ECE4D2"></div>
      <div class="swatch-name">Cream</div><div class="swatch-hex">#ECE4D2</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#E2D8C2"></div>
      <div class="swatch-name">Cream Deep</div><div class="swatch-hex">#E2D8C2</div>
    </div>
  </div>
</div>
</body>
</html>
