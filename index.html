<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FT Design — interior design consultation services in Doha." />
    <meta name="theme-color" content="#0a0908" />
    <title>FT Design — Consultations</title>
    <script>
      (function () {
        try {
          var l = localStorage.getItem('ft-lang');
          if (l === 'ar' || l === 'en') {
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {}
        try {
          var t = localStorage.getItem('ft-theme');
          if (t === 'dark' || t === 'light') {
            document.documentElement.dataset.theme = t;
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', t === 'dark' ? '#0e0c0a' : '#ECE4D2');
            return;
          }
        } catch (e) {}
        document.documentElement.dataset.theme = 'dark';
        var m2 = document.querySelector('meta[name="theme-color"]');
        if (m2) m2.setAttribute('content', '#0a0908');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
