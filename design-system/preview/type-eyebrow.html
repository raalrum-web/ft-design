<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eyebrow lockup</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { justify-content: center; align-items: center; padding: 32px; }
  .lockup { width: 100%; }
  .rule {
    border-top: 1px solid var(--ft-ink);
    border-bottom: 1px solid var(--ft-ink);
    text-align: center;
    padding: 12px 16px;
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ft-ink);
  }
  .rule-serif {
    border-top: 1px solid var(--ft-ink);
    border-bottom: 1px solid var(--ft-ink);
    text-align: center;
    padding: 12px 16px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 19px;
    letter-spacing: 0.05em;
    color: var(--ft-ink);
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="lockup">
    <div class="rule">Design Consultation Services</div>
    <div class="rule-serif">Section Identifier</div>
  </div>
</div>
</body>
</html>
