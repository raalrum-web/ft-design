<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wood &amp; brass</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="swatch">
      <div class="swatch-chip" style="background:#4A3220"></div>
      <div class="swatch-name">Walnut Deep</div><div class="swatch-hex">#4A3220</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#6B4A2B"></div>
      <div class="swatch-name">Walnut</div><div class="swatch-hex">#6B4A2B</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#B88B4A"></div>
      <div class="swatch-name">Brass</div><div class="swatch-hex">#B88B4A</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#D9B27A"></div>
      <div class="swatch-name">Brass Light</div><div class="swatch-hex">#D9B27A</div>
    </div>
  </div>
</div>
</body>
</html>
