<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wordmark</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { justify-content: center; align-items: center; gap: 14px; padding: 28px 32px; }
  .lockup {
    display: flex; align-items: stretch; gap: 0;
    border: 1px solid var(--ft-ink);
  }
  .name {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 36px;
    letter-spacing: -0.01em;
    color: var(--ft-ink);
    padding: 14px 24px;
    border-right: 1px solid var(--ft-ink);
    line-height: 1;
  }
  .mono {
    width: 64px;
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
  }
  .mono img { width: 36px; height: auto; }
  .rule {
    width: 100%;
    text-align: center;
    border: 1px solid var(--ft-ink);
    padding: 10px 12px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 18px;
    letter-spacing: 0.04em;
    color: var(--ft-ink);
  }
</style>
</head>
<body>
<div class="card">
  <div class="lockup">
    <div class="name">FT Design</div>
    <div class="mono"><img src="../assets/logo-ft-black.svg" alt=""></div>
  </div>
  <div class="rule">Design Consultation Services</div>
</div>
</body>
</html>
