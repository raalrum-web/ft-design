<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .card { padding: 24px; justify-content: center; }
  .row { display: flex; gap: 18px; align-items: flex-end; justify-content: center; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 60px; background: var(--ft-paper); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
  .name { font-family: var(--font-mono, monospace); font-size: 11px; color: var(--fg-3); }
</style>
</head>
<body>
<div class="card">
  <div class="row">
    <div class="item"><div class="box" style="border-radius:0"></div><div class="name">0 · sharp</div></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><div class="name">4 · sm</div></div>
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">6 · md</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">10 · lg</div></div>
    <div class="item"><div class="box" style="width:80px; height:32px; border-radius:999px"></div><div class="name">pill</div></div>
  </div>
</div>
</body>
</html>
