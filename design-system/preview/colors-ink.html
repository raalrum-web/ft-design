<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ink scale</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="swatch">
      <div class="swatch-chip" style="background:#1F1B17"></div>
      <div class="swatch-name">Ink</div><div class="swatch-hex">#1F1B17</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#3A332B"></div>
      <div class="swatch-name">Ink 2</div><div class="swatch-hex">#3A332B</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#6B6259"></div>
      <div class="swatch-name">Ink 3</div><div class="swatch-hex">#6B6259</div>
    </div>
    <div class="swatch">
      <div class="swatch-chip" style="background:#948B7E"></div>
      <div class="swatch-name">Ink 4</div><div class="swatch-hex">#948B7E</div>
    </div>
  </div>
</div>
</body>
</html>
